[package]
name = "nixe-home"
version = "0.1.0"
description = "Home Assistant and desktop automation for Nixe"
license = "MIT"
repository = "https://github.com/design-nexus/nixe-home"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nixe-home"
path = "src/main.rs"

[[bin]]
name = "nixe-homed"
path = "src/bin/homed.rs"

[[bin]]
name = "nixe-homectl"
path = "src/bin/homectl.rs"

[dependencies]
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "7cd0be5d09cd1d91510794f58bbc720605951c12" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "609c1d2a5af41a8ee3b76ba23611eb30d95a4743" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "609c1d2a5af41a8ee3b76ba23611eb30d95a4743" }
async-channel = "2"
futures-util = "0.3"
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"
petgraph = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
zbus = "5"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
