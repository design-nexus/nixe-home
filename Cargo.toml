[package]
name = "nyx-home"
version = "0.1.0"
description = "Home Assistant and desktop automation for Nyx"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-home"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-home"
path = "src/main.rs"

[[bin]]
name = "nyx-homed"
path = "src/bin/homed.rs"

[[bin]]
name = "nyx-homectl"
path = "src/bin/homectl.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "5c4172947c18876c05d3173d2ebe2a1e434b098b" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "5c4172947c18876c05d3173d2ebe2a1e434b098b" }
nyx-playback = { git = "https://github.com/design-nexus/nyx-design.git", rev = "5c4172947c18876c05d3173d2ebe2a1e434b098b" }
async-channel = "2"
futures-util = "0.3"
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"
petgraph = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1"
